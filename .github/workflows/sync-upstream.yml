name: sync-upstream

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:
    inputs:
      upstream_branch:
        description: "Upstream branch to merge"
        required: false
        type: string
        default: dev
      base_branch:
        description: "Fork base branch for the sync PR"
        required: false
        type: string
        default: dev

concurrency: sync-upstream-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    if: github.repository == 'zjm54321/opencode-openai-prefix'
    runs-on: ubuntu-24.04
    env:
      GH_REPO: zjm54321/opencode-openai-prefix
      GH_TOKEN: ${{ github.token }}
      BASE_BRANCH: ${{ github.event.inputs.base_branch || 'dev' }}
      UPSTREAM_BRANCH: ${{ github.event.inputs.upstream_branch || 'dev' }}
      SYNC_BRANCH: sync-upstream-dev
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream into sync branch
        id: merge
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/anomalyco/opencode.git
          git fetch origin "$BASE_BRANCH" --no-tags
          git fetch upstream "$UPSTREAM_BRANCH" --no-tags
          git checkout -B "$SYNC_BRANCH" "origin/$BASE_BRANCH"
          git merge --no-ff --no-edit "upstream/$UPSTREAM_BRANCH"

          if git diff --quiet "origin/$BASE_BRANCH" HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No upstream changes to sync."
            exit 0
          fi

          git push --force-with-lease origin "$SYNC_BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Create or update sync PR
        if: steps.merge.outputs.changed == 'true'
        shell: bash
        run: |
          existing=$(gh pr list \
            --repo "$GH_REPO" \
            --head "$SYNC_BRANCH" \
            --base "$BASE_BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number // ""')

          title="sync: merge upstream $UPSTREAM_BRANCH"
          body=$'Automated safe upstream sync.\n\nThis workflow fetches upstream with --no-tags and creates a PR only; it does not publish or mirror upstream release tags.'

          if [ -n "$existing" ]; then
            gh pr edit "$existing" --repo "$GH_REPO" --title "$title" --body "$body"
          else
            gh pr create \
              --repo "$GH_REPO" \
              --head "$SYNC_BRANCH" \
              --base "$BASE_BRANCH" \
              --title "$title" \
              --body "$body"
          fi
